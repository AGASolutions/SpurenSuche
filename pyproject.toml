[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "public-person-scan"
version = "0.1.0"
description = "Datensparsame Recherche in explizit erlaubten öffentlichen Quellen"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
person-scan = "person_scan.cli:main"
person-scan-web = "person_scan.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
